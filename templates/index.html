<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credit Card Fraud Detector</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#e2e8f0; --mut:#94a3b8;
          --ok:#22c55e; --bad:#ef4444; --acc:#6366f1; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--txt); }
  main { max-width:960px; margin:0 auto; padding:24px 16px 60px; }
  h1 { margin:0 0 4px; } p.sub { color:var(--mut); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:18px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
  label { font-size:12px; color:var(--mut); display:block; margin-bottom:3px; }
  input[type=number] { width:100%; padding:7px; border-radius:6px; border:1px solid var(--line); background:#0b1220; color:var(--txt); }
  .amount { max-width:220px; margin-bottom:14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  button.act { padding:10px 18px; border:0; border-radius:8px; cursor:pointer; font-weight:600; color:#fff; background:var(--acc); }
  button.sec { padding:10px 14px; border:1px solid var(--line); border-radius:8px; cursor:pointer; background:transparent; color:var(--txt); }
  #result { display:none; text-align:center; padding:22px; border-radius:12px; margin-top:16px; }
  #result.ok { background:rgba(34,197,94,.12); border:1px solid var(--ok); }
  #result.bad { background:rgba(239,68,68,.12); border:1px solid var(--bad); }
  #result h2 { margin:0 0 6px; } .err { color:var(--bad); margin-top:10px; }
  .hidden { display:none; }
  .hint { font-size:13px; color:var(--mut); }
</style>
</head>
<body>
<main>
  <h1>💳 Credit Card Fraud Detector</h1>
  <p class="sub">Enter a transaction's features and the trained model estimates whether it looks fraudulent.</p>

  <div class="card">
      <div class="row" style="margin-top:0;margin-bottom:12px">
        <button class="sec" id="sN">Load normal sample</button>
        <button class="sec" id="sF">Load fraud sample</button>
        <button class="sec" id="sC">Clear</button>
      </div>
      <div class="amount">
        <label for="Amount">Amount (raw, e.g. 149.62)</label>
        <input type="number" step="any" min="0" id="Amount">
      </div>
      <p class="hint">V1–V28 are anonymised PCA features from the dataset (they can be negative).</p>
      <div class="grid">
        {% for f in features if f != 'Amount' %}
        <div><label for="{{ f }}">{{ f }}</label><input type="number" step="any" id="{{ f }}"></div>
        {% endfor %}
      </div>
      <div class="row"><button class="act" id="go">Check transaction</button></div>
      <div id="result"><h2 id="verdict"></h2><div id="prob"></div></div>
      <div class="err" id="err"></div>
  </div>
</main>

<script>
const FEATURES = {{ features | tojson }};
const $ = id => document.getElementById(id);

let SAMPLES = {normal: [], fraud: []};
fetch('/api/samples').then(r => r.json()).then(s => SAMPLES = s);

function fill(row) { FEATURES.forEach(f => $(f).value = row[f] ?? ''); }
function pick(kind) {
  const list = SAMPLES[kind];
  if (!list.length) { $('err').textContent = 'No samples available (run train.py first).'; return; }
  fill(list[Math.floor(Math.random() * list.length)]); $('err').textContent = ''; $('result').style.display = 'none';
}
$('sN').onclick = () => pick('normal');
$('sF').onclick = () => pick('fraud');
$('sC').onclick = () => { fill({}); $('result').style.display = 'none'; $('err').textContent = ''; };

$('go').onclick = async () => {
  $('err').textContent = ''; $('result').style.display = 'none';
  const payload = {}; FEATURES.forEach(f => payload[f] = $(f).value);
  const r = await fetch('/api/predict', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
  const d = await r.json();
  if (!r.ok) { $('err').textContent = d.error; return; }
  const box = $('result');
  box.className = d.is_fraud ? 'bad' : 'ok'; box.style.display = 'block';
  $('verdict').textContent = (d.is_fraud ? '⚠️ ' : '✅ ') + d.verdict;
  $('prob').textContent = 'Model fraud probability: ' + (d.fraud_probability * 100).toFixed(1) + '%';
};

</script>
</body>
</html>
